<!doctype html>
<!-- Share image (Open Graph) template, 1200×630, premium-dark. Rendered by scripts/build-og.mjs
     (`npm run og`), which passes the text for each page and language in the URL hash. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Display';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
      }
      @font-face {
        font-family: 'Display';
        src: url('../node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-ext-wght-normal.woff2') format('woff2');
        font-weight: 200 800;
        unicode-range: U+0100-024F, U+1E00-1EFF;
      }
      @font-face {
        font-family: 'Serif';
        src: url('../node_modules/@fontsource-variable/fraunces/files/fraunces-latin-opsz-italic.woff2') format('woff2');
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: 'Plex';
        src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'Plex';
        src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2') format('woff2');
        font-weight: 600;
      }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #0a0b0f;
        color: #f3eee6;
        font-family: 'Plex', sans-serif;
      }
      /* warm glow behind the portrait, a fainter one at the lower left */
      .glow {
        position: absolute; inset: 0;
        background:
          radial-gradient(46% 62% at 78% 46%, rgb(226 87 43 / 0.55), rgb(245 158 59 / 0.16) 48%, transparent 72%),
          radial-gradient(40% 50% at 6% 104%, rgb(226 87 43 / 0.20), transparent 70%),
          radial-gradient(70% 90% at 30% 40%, rgb(255 255 255 / 0.025), transparent 70%);
      }
      /* the giant outlined surname, as in the hero */
      .word {
        position: absolute; right: -24px; top: 34px;
        font-family: 'Display'; font-weight: 800; font-size: 238px; line-height: 0.8; letter-spacing: -0.05em;
        color: transparent; -webkit-text-stroke: 1.5px rgb(243 238 230 / 0.09);
      }
      .portrait {
        position: absolute; right: 8px; bottom: 0; height: 600px;
        filter: drop-shadow(0 30px 60px rgb(0 0 0 / 0.55));
        -webkit-mask-image: linear-gradient(to bottom, #000 82%, transparent 100%);
      }
      /* keeps the text readable where it meets the portrait */
      .scrim { position: absolute; inset: 0; background: linear-gradient(90deg, #0a0b0f 0%, rgb(10 11 15 / 0.92) 44%, transparent 64%); }
      .text { position: absolute; left: 72px; top: 0; bottom: 0; width: 680px; display: flex; flex-direction: column; justify-content: center; padding-bottom: 36px; }
      .eyebrow {
        font-family: 'Plex'; font-weight: 600; font-size: 22px; letter-spacing: 0.2em; text-transform: uppercase;
        color: #f59e3b;
      }
      h1 {
        margin-top: 22px;
        font-family: 'Display'; font-weight: 750; font-size: 86px; line-height: 0.96; letter-spacing: -0.045em;
      }
      .title { margin-top: 22px; font-size: 30px; font-weight: 500; color: rgb(243 238 230 / 0.86); }
      .line {
        margin-top: 30px; padding-left: 22px; border-left: 3px solid #e2572b;
        font-family: 'Serif'; font-style: italic; font-weight: 340; font-size: 34px; line-height: 1.22;
        color: #f3eee6; max-width: 600px;
      }
      .line:empty { display: none; }
      .foot { position: absolute; left: 72px; bottom: 46px; display: flex; align-items: center; gap: 14px; font-size: 22px; font-weight: 500; color: rgb(243 238 230 / 0.72); }
      .foot svg { height: 30px; width: auto; }
      /* event variant: a larger amber line for the date and place */
      body.event h1 { font-size: 76px; }
      body.event .line { font-family: 'Display'; font-style: normal; font-weight: 600; font-size: 34px; letter-spacing: -0.02em; color: #f59e3b; border-left-color: #f59e3b; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="word">MIMOUDI</div>
    <img class="portrait" src="../public/img/hero/aziz-cutout-1100.webp" alt="" />
    <div class="scrim"></div>
    <div class="text">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="name">Dr. Aziz Mimoudi</h1>
      <p class="title" id="title"></p>
      <p class="line" id="line"></p>
    </div>
    <div class="foot">
      <svg viewBox="4 20 58 34" aria-hidden="true"><path id="m" fill="#f3eee6" /><circle cx="55" cy="47" r="6" fill="#e8622c" /></svg>
      mimoudi.com
    </div>
    <script>
      const d = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
      for (const k of ['name', 'eyebrow', 'title', 'line']) document.getElementById(k).textContent = d[k] ?? '';
      if (d.event) document.body.classList.add('event');
      // The favicon's "m" outline, passed in by the build script so the mark is identical.
      if (d.m) document.getElementById('m').setAttribute('d', d.m);
      document.fonts.ready.then(() => document.body.setAttribute('data-ready', ''));
    </script>
  </body>
